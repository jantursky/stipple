# The Xcode project of the iOS gallery app. Generate GalleryApp.xcodeproj with `xcodegen` in this directory;
# the build phase below builds the GalleryKit framework from :samples:app with Gradle.
name: GalleryApp
options:
  bundleIdPrefix: com.jantursky.stipple.samples
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The Kotlin framework is built for arm64 simulators only (no iosX64 target).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.jantursky.stipple.samples.gallery
    FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework GalleryKit"
targets:
  GalleryApp:
    type: application
    platform: iOS
    sources:
      - GalleryApp
    info:
      path: GalleryApp/Info.plist
      properties:
        CFBundleDisplayName: Stipple gallery
        UILaunchScreen:
          UIColorName: LaunchBackground
        CADisableMinimumFrameDurationOnPhone: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :samples:app:embedAndSignAppleFrameworkForXcode
