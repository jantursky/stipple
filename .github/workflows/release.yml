name: Release

# Pushing a version tag, `1.0.0` or `v1.0.0`, creates the GitHub release with the
# matching CHANGELOG section, then asks JitPack to build it. JitPack builds the tag
# itself (see jitpack.yml); the second job requests that build and waits for it, so a
# failed build shows up here. Run it by hand with a tag to release a tag pushed earlier.
on:
  push:
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as 1.0.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Tag matches the package version
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          test "${TAG#v}" = "$version" || { echo "Tag $TAG does not match version $version" >&2; exit 1; }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${TAG#v}" >&2
            exit 1
          fi
          echo "[JitPack](https://jitpack.io/#jantursky/stipple/${TAG#v})" >> notes.md
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md

  jitpack:
    runs-on: ubuntu-latest
    steps:
      - name: Build the tag on JitPack
        run: |
          version="${TAG#v}"
          pom="https://jitpack.io/com/github/jantursky/stipple/stipple/$version/stipple-$version.pom"
          for attempt in $(seq 1 60); do
            if curl -sfL "$pom" > /dev/null; then
              echo "stipple@$version is on JitPack"
              exit 0
            fi
            sleep 30
          done
          echo "JitPack did not build $version: https://jitpack.io/com/github/jantursky/stipple/$version/build.log" >&2
          exit 1
